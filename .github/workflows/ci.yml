name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & import check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=build,dist,__pycache__,.git --ignore=E501,W503

      - name: Verify all modules import cleanly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          from core.models import Task, AppSettings, ScheduleConfig, NotificationConfig
          from core.storage import load_data, save_data
          from core.task_manager import TaskManager
          from core.scheduler import Scheduler, _should_reset, _next_reset_dt
          print('core OK')
          from ui.theme import get_stylesheet
          from ui.task_item import TaskItemWidget
          from ui.task_dialog import TaskDialog
          from ui.settings_dialog import SettingsDialog
          from ui.main_window import MainWindow, _toast
          print('ui OK')
          "
